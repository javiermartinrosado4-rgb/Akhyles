name: akhyles
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/community/Dockerfile
    env_file:
      - ../../server/.env.production
    volumes:
      - akhyles_data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2.10-alpine
    env_file:
      - ../../server/.env.production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    stop_grace_period: 30s

  backup:
    build:
      context: ../..
      dockerfile: deploy/community/backup.Dockerfile
    env_file:
      - ../../server/.env.backup
    volumes:
      - akhyles_data:/data:ro
      - ../../server/backup-password.txt:/run/secrets/restic-password:ro
    tmpfs:
      - /backup-staging:size=2g,uid=1000,gid=1000,mode=0700
      - /tmp:size=128m,mode=1777
    environment:
      GYM_DATABASE: /data/akhyles.sqlite
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      RESTIC_CACHE_DIR: /tmp/restic-cache
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');try{process.exit(Date.now()-Number(fs.readFileSync('/backup-staging/last-success'))<93600000?0:1)}catch{process.exit(1)}"]
      interval: 5m
      timeout: 5s
      retries: 1
      start_period: 10m

volumes:
  akhyles_data:
  caddy_data:
  caddy_config:
